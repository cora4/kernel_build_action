name: Build and Release

on:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Hardware Check
      run: |
        if ! grep -q "avx512_vnni" /proc/cpuinfo; then
            echo "Architecture: AVX2 (haswell/zen3)"
            wget -q https://github.com/cora4/ik_llama.cpp/releases/download/zen3-22-25644/llama-latest-bin-ubuntu-zen3.zip
        elif grep -q "Intel" /proc/cpuinfo; then
            if grep -q "avx512_bf16" /proc/cpuinfo; then
                if lscpu|grep L1i|grep -q "128 KiB"; then
                  echo "Architecture: Granite Rapids"
                else
                  echo "Architecture: Emerald Rapids"
                fi
            else
                echo "Architecture: Ice Lake"
            fi
            wget -q https://github.com/cora4/ik_llama.cpp/releases/download/tgl-83-32393/llama-latest-bin-ubuntu-tgl.zip
        else
            if lscpu | grep "CPU family"|grep -q 26; then
                echo "Architecture: Zen 5"
            else    
                echo "Architecture: Zen 4"
            fi
            wget -q https://github.com/cora4/ik_llama.cpp/releases/download/tgl-83-32393/llama-latest-bin-ubuntu-tgl.zip
        fi
        
    - name: Download Dependencies
      id: dl
      run: |
        # wget -q https://github.com/cora4/ik_llama.cpp/releases/download/a/qwen3-1.7B-Q2_0.gguf
        wget -q https://github.com/cora4/kernel_build_action/releases/download/main-13/qwen3-4B-Q2_0.gguf
        echo $PWD
        find
        printf '%s\n' "$PWD"/*
        find "$PWD" -maxdepth 1 -mindepth 1 -print
        wget -q https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b9596-9fcaed7/llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz

    - name: Extract Binaries
      run: |
        unzip -o llama-latest-bin-ubuntu-tgl.zip -d /tmp/ || \
        unzip -o llama-latest-bin-ubuntu-zen3.zip -d /tmp/
        tar --no-overwrite-dir -xf llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz -C /tmp/ || true

    - name: System Information
      run: |
        echo $PWD
        mount
        free -h
        echo "Current Directory: $PWD"
        echo "CPU Cores:"
        lscpu

    - name: Verify Binary Versions
      run: |
        echo "Testing Llama Prism:"
        /tmp/llama-prism-b9596-9fcaed7/llama-server --version
        echo "Testing ik_llama.cpp:"
        /tmp/llama-latest/llama-server --version
        
#    - name: Quantise Model IQ4_NL
#      run: |
#        /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
#          --allow-requantize --token-embedding-type iq4_nl \
#          --tensor-type attn_k=iq4_nl --tensor-type attn_q=iq4_nl --tensor-type attn_v=iq4_nl \
#          --tensor-type ffn_down=iq4_nl --tensor-type ffn_gate=iq4_nl --tensor-type ffn_up=iq4_nl \
#          --tensor-type attn_output=iq4_nl qwen3-4B-Q2_0.gguf /tmp/qwen3-4B-IQ4_NL.gguf iq4_nl

#    - name: Quantise Model IQ4_XS
#      run: |
#        /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
#          --allow-requantize --token-embedding-type iq4_xs \
#          --tensor-type attn_k=iq4_xs --tensor-type attn_q=iq4_xs --tensor-type attn_v=iq4_xs \
#          --tensor-type ffn_down=iq4_xs --tensor-type ffn_gate=iq4_xs --tensor-type ffn_up=iq4_xs \
#          --tensor-type attn_output=iq4_xs qwen3-4B-Q2_0.gguf /tmp/qwen3-4B-IQ4_XS.gguf iq4_xs

    #- name: Quantise Model MXFP4
    #  run: |
    #    /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
    #      --allow-requantize --token-embedding-type mxfp4 \
    #      --tensor-type attn_k=mxfp4 --tensor-type attn_q=mxfp4 --tensor-type attn_v=mxfp4 \
    #      --tensor-type ffn_down=mxfp4 --tensor-type ffn_gate=mxfp4 --tensor-type ffn_up=mxfp4 \
    #      --tensor-type attn_output=mxfp4 qwen3-4B-Q2_0.gguf /tmp/qwen3-4B-MXFP4.gguf 38|

    - name: Quantise Model Q4_0
      run: |          
        /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
          --allow-requantize --token-embedding-type Q4_0 \
          --tensor-type attn_k=q4_0 --tensor-type attn_q=q4_0 --tensor-type attn_v=q4_0 \
          --tensor-type ffn_down=q4_0 --tensor-type ffn_gate=q4_0 --tensor-type ffn_up=q4_0 \
          --tensor-type attn_output=q4_0 qwen3-4B-Q2_0.gguf /tmp/qwen3-4B-Q4_0.gguf q4_0
        rm qwen3-4B-Q2_0.gguf
        #mv qwen3-4B-Q2_0.gguf /tmp/qwen3-4B-Q2_0.gguf

    - name: Quantise Model IQ4_KS_R4
      run: |
        /tmp/llama-latest/llama-quantize \
          --allow-requantize --token-embedding-type iq4_ks \
          --ffn-down-type iq4_ks_r4 --attn-v-type iq4_ks_r4 /tmp/qwen3-4B-Q4_0.gguf /tmp/qwen3-4B-IQ4_KS_R4.gguf iq4_ks_r4

#    - name: Quantise Model IQ4_KS_R16
#      run: |
#        /tmp/llama-latest/llama-quantize \
#          --allow-requantize --token-embedding-type iq4_ks_r16 \
#          --ffn-down-type iq4_ks_r16 --attn-v-type iq4_ks_r16 /tmp/qwen3-4B-Q4_0.gguf /tmp/qwen3-4B-IQ4_KS_R16.gguf iq4_ks_r16
          
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Release
      run: |
        echo $PWD
        TAG=main-${{ github.run_number }}-$RANDOM
        git tag $TAG
        git push origin $TAG
        gh release create "$TAG" /tmp/qwen3-4B-IQ4_KS_R4.gguf \
          --title "Release $TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
