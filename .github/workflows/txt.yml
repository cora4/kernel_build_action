name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir -p dist
          echo "hello world" > dist/output.txt

      - name: Create Release
        run: |
          TAG=main-${{ github.run_number }}-$RANDOM
          git tag $TAG
          git push origin $TAG
          gh release create $TAG dist/output.txt \
            --title "Release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
