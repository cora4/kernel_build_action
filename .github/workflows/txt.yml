name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir -p dist
          wget https://github.com/cora4/models-playground/actions/runs/26847789336/artifacts/7369728547

      - name: Create Release
        run: |
          TAG=main-${{ github.run_number }}-$RANDOM
          git tag $TAG
          git push origin $TAG
          gh release create $TAG oneapi.zip \
            --title "Release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
