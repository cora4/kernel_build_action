name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag main-${{ github.run_number }}
          git push origin main-${{ github.run_number }}

      - name: Build artifact
        run: |
          mkdir -p dist
          echo "hello world" > dist/output.txt


      - name: Create Release
        run: |
          TAG=main-${{ github.run_number }}
          git tag $TAG
          git push origin $TAG
          gh release create $TAG dist/output.txt \
            --title "Release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
