# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - name: Add to PATH
        run: echo "./clang-4.9/clang-r416183b/bin/" >> $GITHUB_PATH
      - name: Get clang
        run: echo $PWD; mkdir ./clang-4.9;ls -dl clang-4.9;wget -q https://github.com/tomxi1997/Toolchain-for-aarch64-hosts/releases/download/v15/clang-r416183b.tar.xz;tar xJf clang-r416183b.tar.xz -C ./clang-4.9;touch ./clang-4.9/not-linux-tool; rm clang-r416183b.tar.xz
      - name: Get gcc
        run: mkdir ./gcc-4.9;wget -q https://github.com/tomxi1997/Toolchain-for-aarch64-hosts/releases/download/v6/google_gcc-4.9-main-20240120.tar.xz;tar xJf google_gcc-4.9-main-20240120.tar.xz -C ./gcc-4.9/;rm google_gcc-4.9-main-20240120.tar.xz
      - name: Setup gcc
        run: cd ./gcc-4.9;git init --initial-branch=main; git add .;git config user.name "runner";git config user.email "runner@example.com";git commit -m "init"
      - name: Setup clang
        run: cd ./clang-4.9;git init --initial-branch=main; git add .;git config user.name "runner";git config user.email "runner@example.com";git commit -m "init"
      - name: Build Kernel
        id: gmake_build
        uses: cora4/kernel_build_action@main
        with:
          kernel-url: https://github.com/cora4/kernel_red
          kernel-dir: msm-5.4
          kernel-branch: 11
          config: gki_defconfig
          arch: arm64
          aosp-gcc: false
          aosp-clang: false
          other-clang-url: ./clang-4.9/
          other-gcc64-url: ./gcc-4.9/google_gcc-4.9-main/aarch64
          other-gcc32-url: ./gcc-4.9/google_gcc-4.9-main/arm
          anykernel3: true
          android-version: 12
          aosp-clang-version: r416183b1
          ccache: true
          disable-lto: false
          extra-make-args: '[
            "LLVM=1",
            "LLVM_IAS=1"
           ]'
      - name: Upload Build Artifact
        if: ${{ always() && steps.gmake_build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: gki-kernel
          path: kernel/msm-5.4/out/arch/arm64/boot
