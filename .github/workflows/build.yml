# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Install libc6-dev-i386
      run: sudo apt install libc6-dev-i386
      - name: Build Kernel
        uses: cora4/kernel_build_action@main
        with:
          kernel-url: https://github.com/cora4/kernel_red
          kernel-dir: msm-5.4
          kernel-branch: 11
          config: gki_defconfig
          arch: arm64
          aosp-gcc: false
          aosp-clang: false
          other-clang-url: https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz
          other-gcc32-url: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz
          other-gcc64-url: https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          anykernel3: true
          android-version: 12
          aosp-clang-version: r416183b1
          ccache: true
          disable-lto: false
