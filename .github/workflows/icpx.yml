name: Build ICPX and Release

on:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Hardware Check
      run: |
        if ! grep -q "avx512_vnni" /proc/cpuinfo; then
            echo "Architecture: AVX2 (haswell/zen3)"
            #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/zen3-22-25644/llama-latest-bin-ubuntu-zen3.zip
        elif grep -q "Intel" /proc/cpuinfo; then
            if grep -q "avx512_bf16" /proc/cpuinfo; then
                if lscpu|grep L1i|grep -q "128 KiB"; then
                  echo "Architecture: Granite Rapids"
                else
                  echo "Architecture: Emerald Rapids"
                fi
            else
                echo "Architecture: Ice Lake"
            fi
            #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/tgl-83-32393/llama-latest-bin-ubuntu-tgl.zip
        else
            if lscpu | grep "CPU family"|grep -q 26; then
                echo "Architecture: Zen 5"
            else    
                echo "Architecture: Zen 4"
            fi
            #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/tgl-83-32393/llama-latest-bin-ubuntu-tgl.zip
        fi
        
    - name: Download Dependencies
      id: dl
      run: |
         sudo apt update
         sudo apt install \
         intel-oneapi-compiler-dpcpp-cpp \
         intel-oneapi-mkl-devel \
         --download-only --no-install-recommends
         cd /var/cache/apt/archives/
         zip -r0XD /tmp/icpx.zip *.deb

    - name: System Information
      run: |
        echo $PWD
        mount
        free -h
        echo "Current Directory: $PWD"
        echo "CPU Cores:"
        lscpu
        
    - name: Checkout
      uses: actions/checkout@v7

    - name: Create Release
      run: |
        echo $PWD
        TAG=icpx-${{ github.run_number }}-$RANDOM
        git tag $TAG
        git push origin $TAG
        gh release create "$TAG" /tmp/icpx.zip \
          --title "Release $TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
